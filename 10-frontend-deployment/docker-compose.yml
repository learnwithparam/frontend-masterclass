version: '3.8'

# Full-Stack Deployment: Frontend + Backend
# This brings up the ENTIRE application stack in production mode.

services:
  # --- Backend (from backend-masterclass/11-ship-it) ---
  db:
    image: postgres:15-alpine
    container_name: fullstack_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fullstack_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend-masterclass/11-ship-it
      dockerfile: after/order-service/Dockerfile
    container_name: fullstack_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/bookstore
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_secret_key
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Frontend (this module) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack_frontend
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:3000/api
    depends_on:
      - backend

volumes:
  db_data:
